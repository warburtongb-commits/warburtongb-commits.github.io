<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BLUNT Performance System</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #F5A623;
    color: #F4F1ED;
}

/* HEADER */
header {
    padding: 18px 25px;
    background: #1A1A2E;
    border-bottom: 1px solid #1A1A2E;
}

/* SUMMARY ROW */
.summary {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    padding: 20px;
}

.summary-card {
    background: #1A1A2E;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
}

.summary-value {
    font-size: 22px;
    font-weight: bold;
}

.summary-label {
    font-size: 12px;
    color: #94a3b8;
}

/* CONTROLS */
.controls {
    display: flex;
    gap: 10px;
    padding: 0 20px 10px;
}

select {
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #1A1A2E;
    color: #F4F1ED;
}

/* STORE GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 15px;
    padding: 20px;
}

/* STORE CARD */
.card {
    background: #1A1A2E;
    border-radius: 14px;
    padding: 15px;
}

.store-title {
    font-size: 16px;
    font-weight: bold;
}

.badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    margin-top: 5px;
}

.pass { background: #16a34a; }
.fail { background: #dc2626; }

/* SCORE */
.total-score {
    font-size: 26px;
    margin: 10px 0;
}

/* PROGRESS BARS */
.bar {
    background: #0f172a;
    border-radius: 6px;
    height: 8px;
    margin: 5px 0 10px;
    overflow: hidden;
}

.fill {
    height: 100%;
}

/* COLORS */
.b { background: #60a5fa; }
.l { background: #34d399; }
.u { background: #fbbf24; }
.n { background: #f97316; }
.t { background: #a78bfa; }

.small {
    font-size: 11px;
    color: #94a3b8;
}
</style>
</head>

<body>

<header>
<h2>BLUNT Performance Dashboard</h2>
</header>

<!-- SUMMARY -->
<div class="summary">
    <div class="summary-card">
        <div class="summary-value" id="totalStores">0</div>
        <div class="summary-label">Total Stores</div>
    </div>

    <div class="summary-card">
        <div class="summary-value" id="passCount">0</div>
        <div class="summary-label">Passing</div>
    </div>

    <div class="summary-card">
        <div class="summary-value" id="failCount">0</div>
        <div class="summary-label">Failing</div>
    </div>

    <div class="summary-card">
        <div class="summary-value" id="avgScore">0</div>
        <div class="summary-label">Avg Score (/75)</div>
    </div>

    <div class="summary-card">
        <div class="summary-value" id="weakest">-</div>
        <div class="summary-label">Weakest Category</div>
    </div>
</div>

<!-- CONTROLS -->
<div class="controls">
    <select id="filter" onchange="render()">
        <option value="all">All Stores</option>
        <option value="pass">Passing</option>
        <option value="fail">Failing</option>
    </select>

    <select id="sort" onchange="render()">
        <option value="scoreDesc">Highest Score</option>
        <option value="scoreAsc">Lowest Score</option>
        <option value="name">Name</option>
    </select>
</div>

<!-- STORE GRID -->
<div class="grid" id="storeGrid"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbxCkmVdBPq__jiO-6vaXB4iIaPgVCgkT_ikyaeXXmnH_OO-0zqqcHkO8jPtl3C1Pmia/exec";

let data = [];

async function load() {
    const res = await fetch(API_URL);
    data = await res.json();

    calculateSummary();
    render();
}

function calculateSummary() {

    const stores = data.length;

    let pass = 0;
    let fail = 0;

    let total = 0;

    let b=0,l=0,u=0,n=0,t=0;

    data.forEach(s => {

        const score = s.B + s.L + s.U + s.N + s.T;
        total += score;

        if (score >= 68) pass++;
        else fail++;

        b += s.B;
        l += s.L;
        u += s.U;
        n += s.N;
        t += s.T;
    });

    const weakestMap = [
        ["B", b],
        ["L", l],
        ["U", u],
        ["N", n],
        ["T", t]
    ].sort((a,b)=>a[1]-b[1])[0][0];

    document.getElementById("totalStores").innerText = stores;
    document.getElementById("passCount").innerText = pass;
    document.getElementById("failCount").innerText = fail;
    document.getElementById("avgScore").innerText =
        (total / stores).toFixed(1);

    document.getElementById("weakest").innerText = weakestMap;
}

function render() {

    let filtered = [...data];

    const filter = document.getElementById("filter").value;
    const sort = document.getElementById("sort").value;

    filtered = filtered.map(s => ({
        ...s,
        total: s.B + s.L + s.U + s.N + s.T
    }));

    if (filter === "pass") filtered = filtered.filter(s => s.total >= 68);
    if (filter === "fail") filtered = filtered.filter(s => s.total < 68);

    if (sort === "scoreDesc") filtered.sort((a,b)=>b.total-a.total);
    if (sort === "scoreAsc") filtered.sort((a,b)=>a.total-b.total);
    if (sort === "name") filtered.sort((a,b)=>a.store.localeCompare(b.store));

    const grid = document.getElementById("storeGrid");
    grid.innerHTML = "";

    filtered.forEach(s => {

        const pass = s.total >= 68;

        grid.innerHTML += `
        <div class="card">
            <div class="store-title">${s.store}</div>

            <div class="badge ${pass ? "pass" : "fail"}">
                ${pass ? "PASS" : "FAIL"}
            </div>

            <div class="total-score">${s.total}/75</div>

            ${bar("B", s.B, "b")}
            ${bar("L", s.L, "l")}
            ${bar("U", s.U, "u")}
            ${bar("N", s.N, "n")}
            ${bar("T", s.T, "t")}
        </div>
        `;
    });
}

function bar(label, value, cls) {
    return `
    <div class="small">${label}: ${value}/15</div>
    <div class="bar">
        <div class="fill ${cls}" style="width:${(value/15)*100}%"></div>
    </div>
    `;
}

load();

</script>

</body>
</html>
